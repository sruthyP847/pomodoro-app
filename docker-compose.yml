services:
  postgres:
    image: postgres:16
    container_name: pomme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pomme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomme}
      POSTGRES_DB: ${POSTGRES_DB:-pomme}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pomme-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pomme} -d ${POSTGRES_DB:-pomme}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pomme-postgres-data:
